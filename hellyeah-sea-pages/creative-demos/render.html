<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="data:," />
    <title>Hellyeah Creative Renderer</title>
    <style>
      :root {
        --accent: #ff5b3f;
        --accent-dark: #9f2f1d;
        --ink: #11130f;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        letter-spacing: 0;
      }

      .creative {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        color: var(--white);
        background: var(--ink);
      }

      .photo {
        position: absolute;
        inset: 0;
        background-image: var(--photo);
        background-position: var(--photo-position);
        background-size: cover;
      }

      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(7, 9, 7, 0.58);
      }

      .topbar {
        position: absolute;
        z-index: 2;
        top: 54px;
        right: 58px;
        left: 58px;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        color: var(--white);
        background: var(--accent);
        border-radius: 7px;
        font-size: 22px;
        font-weight: 900;
      }

      .brand-copy {
        display: grid;
        gap: 2px;
      }

      .brand-copy strong {
        font-size: 25px;
      }

      .brand-copy span {
        color: rgba(255, 255, 255, 0.72);
        font-size: 14px;
      }

      .content {
        position: absolute;
        z-index: 2;
      }

      .audience {
        margin: 0;
        color: var(--accent);
        font-size: 19px;
        font-weight: 900;
        text-transform: uppercase;
      }

      h1 {
        max-width: 930px;
        margin: 18px 0 0;
        font-size: 64px;
        line-height: 1.03;
      }

      .support {
        max-width: 840px;
        margin: 24px 0 0;
        color: rgba(255, 255, 255, 0.8);
        font-size: 28px;
        line-height: 1.4;
      }

      .offer {
        display: flex;
        align-items: center;
        gap: 15px;
        width: max-content;
        margin-top: 34px;
        padding: 13px 17px;
        color: var(--ink);
        background: var(--white);
        border-left: 9px solid var(--accent);
      }

      .offer strong {
        font-size: 22px;
      }

      .offer span,
      .offer small {
        font-size: 15px;
        font-weight: 800;
      }

      .offer small {
        color: #5d5f59;
      }

      .cta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        margin-top: 32px;
        padding: 20px 23px;
        color: var(--white);
        background: var(--accent);
        font-size: 19px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .cta b {
        font-size: 30px;
        line-height: 0.8;
      }

      .proof {
        position: absolute;
        z-index: 2;
        right: 58px;
        bottom: 32px;
        left: 58px;
        padding-top: 13px;
        color: rgba(255, 255, 255, 0.7);
        border-top: 2px solid rgba(255, 255, 255, 0.35);
        font-size: 15px;
        font-weight: 700;
      }

      .creative.feed .content {
        right: 58px;
        bottom: 86px;
        left: 58px;
      }

      .creative.feed .photo {
        filter: saturate(0.92) contrast(1.04);
      }

      .creative.feed .support {
        max-width: 820px;
      }

      .creative.feed .cta {
        width: 520px;
      }

      .creative.feed .proof {
        display: none;
      }

      .creative.story .topbar {
        top: 92px;
        right: 70px;
        left: 70px;
      }

      .creative.story .brand-mark {
        width: 66px;
        height: 66px;
        font-size: 27px;
      }

      .creative.story .brand-copy strong {
        font-size: 30px;
      }

      .creative.story .brand-copy span {
        font-size: 17px;
      }

      .creative.story .content {
        right: 70px;
        bottom: 180px;
        left: 70px;
      }

      .creative.story .audience {
        font-size: 23px;
      }

      .creative.story h1 {
        margin-top: 24px;
        font-size: 80px;
        line-height: 1.02;
      }

      .creative.story .support {
        margin-top: 32px;
        font-size: 35px;
        line-height: 1.38;
      }

      .creative.story .offer {
        margin-top: 44px;
        padding: 18px 21px;
      }

      .creative.story .offer strong {
        font-size: 28px;
      }

      .creative.story .offer span,
      .creative.story .offer small {
        font-size: 18px;
      }

      .creative.story .cta {
        margin-top: 38px;
        padding: 27px 29px;
        font-size: 24px;
      }

      .creative.story .proof {
        right: 70px;
        bottom: 74px;
        left: 70px;
        font-size: 17px;
      }

      .creative.pmax .photo {
        inset: 0 0 0 52%;
      }

      .creative.pmax .scrim {
        inset: 0 0 0 52%;
        background: rgba(7, 9, 7, 0.25);
      }

      .creative.pmax .topbar {
        top: 38px;
        right: auto;
        left: 50px;
      }

      .creative.pmax .brand-mark {
        width: 44px;
        height: 44px;
        font-size: 18px;
      }

      .creative.pmax .brand-copy strong {
        font-size: 20px;
      }

      .creative.pmax .brand-copy span {
        font-size: 12px;
      }

      .creative.pmax .content {
        top: 132px;
        right: 52%;
        bottom: 56px;
        left: 50px;
        padding-right: 44px;
      }

      .creative.pmax .audience {
        font-size: 15px;
      }

      .creative.pmax h1 {
        margin-top: 13px;
        font-size: 45px;
        line-height: 1.04;
      }

      .creative.pmax .support {
        margin-top: 18px;
        font-size: 20px;
        line-height: 1.36;
      }

      .creative.pmax .offer {
        gap: 10px;
        margin-top: 21px;
        padding: 9px 11px;
        border-left-width: 6px;
      }

      .creative.pmax .offer strong {
        font-size: 16px;
      }

      .creative.pmax .offer span,
      .creative.pmax .offer small {
        font-size: 11px;
      }

      .creative.pmax .cta {
        width: 430px;
        margin-top: 20px;
        padding: 13px 16px;
        font-size: 14px;
      }

      .creative.pmax .proof {
        right: 34px;
        bottom: 23px;
        left: 55%;
        color: rgba(255, 255, 255, 0.84);
        border-top-color: rgba(255, 255, 255, 0.62);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="creative" id="creative">
      <div class="photo" aria-hidden="true"></div>
      <div class="scrim" aria-hidden="true"></div>
      <div class="topbar">
        <span class="brand-mark">H!</span>
        <span class="brand-copy"><strong>Hellyeah</strong><span>AI-assisted campaign launch</span></span>
      </div>
      <div class="content">
        <p class="audience" data-audience></p>
        <h1 data-headline></h1>
        <p class="support" data-support></p>
        <div class="offer"><span>FREE</span><strong>14-DAY PILOT</strong><small>$0 TODAY / NO CARD</small></div>
        <div class="cta"><span data-cta></span><b>&gt;</b></div>
      </div>
      <div class="proof" data-proof></div>
    </main>

    <script>
      const concepts = {
        founders: {
          accent: '#ff5b3f',
          photo: '../assets/founders.jpg',
          positions: { feed: 'center 48%', story: '57% center', pmax: '58% center' },
          audience: 'For owner-led businesses',
          headlines: {
            feed: 'Your business is ready.<br>Your first campaign can be too.',
            story: 'Start advertising.<br>Skip the Ads Manager learning curve.',
            pmax: 'Turn your website into a campaign ready to review.',
          },
          support: 'Add your website and goal. Hellyeah prepares the audience, ads and budget for your approval.',
          cta: 'Build my first campaign',
          proof: 'Website  >  Audience + ads + budget  >  Your approval',
        },
        ecommerce: {
          accent: '#4a67ff',
          photo: '../assets/ecommerce.jpg',
          positions: { feed: 'center 43%', story: '38% center', pmax: '46% center' },
          audience: 'For ecommerce operators',
          headlines: {
            feed: 'The product is ready.<br>Launch the sales campaign today.',
            story: 'Pick one product.<br>Get the campaign ready today.',
            pmax: 'Turn one product page into a focused sales campaign.',
          },
          support: 'Hellyeah turns the product page, offer and revenue goal into ads you can review and launch.',
          cta: 'Launch my product campaign',
          proof: 'Product page  >  Sales campaign  >  Your approval',
        },
        marketers: {
          accent: '#00a786',
          photo: '../assets/marketers.jpg',
          positions: { feed: 'center 46%', story: '52% center', pmax: '53% center' },
          audience: 'For lean in-house teams',
          headlines: {
            feed: 'The brief is approved.<br>Why is setup still taking a week?',
            story: 'Brief approved.<br>Campaign ready today.',
            pmax: 'Move from approved brief to a reviewable campaign.',
          },
          support: 'Hellyeah prepares the audience, first-draft ads and budget while your team keeps final approval.',
          cta: 'Turn my brief into a campaign',
          proof: 'Approved brief  >  Campaign draft  >  Team approval',
        },
        agencies: {
          accent: '#e2882d',
          photo: '../assets/agencies.jpg',
          positions: { feed: 'center 42%', story: 'center 44%', pmax: 'center 45%' },
          audience: 'For small agencies',
          headlines: {
            feed: 'A signed brief should not become another setup queue.',
            story: 'Signed brief in.<br>Client-ready campaign out.',
            pmax: 'Add campaign capacity without losing client control.',
          },
          support: 'Build the client campaign faster. Agency review first. Client approval second.',
          cta: 'Build my next client campaign',
          proof: 'Client brief  >  Campaign draft  >  Agency + client approval',
        },
      }

      const params = new URLSearchParams(window.location.search)
      const persona = concepts[params.get('persona')] ? params.get('persona') : 'founders'
      const format = ['feed', 'story', 'pmax'].includes(params.get('format')) ? params.get('format') : 'feed'
      const concept = concepts[persona]
      const creative = document.querySelector('#creative')

      creative.classList.add(format)
      document.documentElement.style.setProperty('--accent', concept.accent)
      document.documentElement.style.setProperty('--photo', `url('${concept.photo}')`)
      document.documentElement.style.setProperty('--photo-position', concept.positions[format])
      document.querySelector('[data-audience]').textContent = concept.audience
      document.querySelector('[data-headline]').innerHTML = concept.headlines[format]
      document.querySelector('[data-support]').textContent = concept.support
      document.querySelector('[data-cta]').textContent = concept.cta
      document.querySelector('[data-proof]').textContent = concept.proof
      document.title = `${persona}-${format}`
    </script>
  </body>
</html>
